<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小说转剧本 — Novel to Screenplay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-mark">N</div>
      <div>
        <span class="header-text">小说转剧本</span>
        <span class="tagline">Novel to Screenplay</span>
      </div>
      <div class="header-links">
        <a href="/static/schema.html">Schema</a>
        <a href="https://github.com/moonkkkkk/novel-to-screenplay" target="_blank">GitHub</a>
      </div>
    </div>
  </header>

  <main>
    <!-- 输入区 -->
    <section class="input-section">
      <h2 class="section-heading">输入小说</h2>
      <p class="section-desc">支持手动分章或粘贴全文，服务端自动识别章节标题并切分。基于 DeepSeek LLM，三阶段流水线处理。</p>

      <div class="form-row">
        <div class="form-group">
          <label for="title">剧本标题</label>
          <input type="text" id="title" placeholder="如：红楼梦选段" value="测试剧本">
        </div>
        <div class="form-group">
          <label for="genre">类型</label>
          <select id="genre">
            <option value="剧情">剧情</option>
            <option value="喜剧">喜剧</option>
            <option value="悬疑">悬疑</option>
            <option value="科幻">科幻</option>
            <option value="动作">动作</option>
            <option value="爱情">爱情</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="author">原作者</label>
        <input type="text" id="author" placeholder="如：曹雪芹" value="未知">
      </div>

      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="manual" onclick="setInputMode('manual')">
          逐章编辑
        </button>
        <button class="mode-btn" data-mode="raw" onclick="setInputMode('raw')">
          全文粘贴
        </button>
      </div>

      <div id="chapters-container">
        <div class="chapter-block">
          <div class="chapter-header">
            <span>第 1 章</span>
            <button class="btn-remove" title="删除此章" onclick="removeChapter(this)">x</button>
          </div>
          <textarea class="chapter-text" placeholder="在此粘贴第 1 章小说内容..." rows="6">天色微明，李寻在客栈二楼醒来。他推开窗户，冷风裹着细雨打在他脸上。
"又是这个梦。"他揉了揉太阳穴，额头沁出细汗。
三年前的那场大火——每当他闭上眼睛，那夜的画面就浮现：父亲的书房燃起烈焰，书架轰然倒塌，一个黑影从窗边闪过。
他握紧拳头。够了，不能再逃了。他拿起桌上的长剑，推门而出。
客栈老板正趴在柜台后打瞌睡。李寻把几枚铜钱放在桌上："老板，结账。"
"这、这么早就走？"
"嗯。去江州。据我所知，那个人就在那里。"</textarea>
        </div>
        <div class="chapter-block">
          <div class="chapter-header">
            <span>第 2 章</span>
            <button class="btn-remove" title="删除此章" onclick="removeChapter(this)">x</button>
          </div>
          <textarea class="chapter-text" placeholder="在此粘贴第 2 章小说内容..." rows="6">江州城外，官道上行人寥寥。李寻骑着一匹瘦马，斗笠压低遮住了半张脸。
"这位少侠，进城可要小心了。"路边的茶摊老板叫住了他，"最近城里不太平。明月楼的人三天两头来闹事。"
"明月楼？"
"武林第一帮派。听说他们的楼主柳如烟武功高深莫测，连朝廷都忌惮三分。"
李寻没有接话。记忆中父亲那封未寄出的信——"若我遭遇不测，去江州找柳……"信到这里就断了。柳如烟，会是同一个人吗？
远处传来马蹄声。三匹快马从城内冲出，为首的女子一袭白衣，面纱轻掩。她策马奔过茶摊时，目光扫过李寻，目光冷冽如刀。
只是一瞬，但那眼神让李寻心头一震——那双眼睛，他在梦里见过。</textarea>
        </div>
        <div class="chapter-block">
          <div class="chapter-header">
            <span>第 3 章</span>
            <button class="btn-remove" title="删除此章" onclick="removeChapter(this)">x</button>
          </div>
          <textarea class="chapter-text" placeholder="在此粘贴第 3 章小说内容..." rows="6">江州城内，暮色渐浓。李寻找了家客栈安顿下来。
小二端了壶茶推门而入："客官，您的——"
话音未落，那"小二"从托盘下抽出一把匕首，直刺李寻胸口。李寻侧身避过，反手扣住对方手腕。"谁派你来的？"
那人冷笑一声："明月楼的柳楼主想见你。不过，是见你的尸体。"
李寻夺过匕首将他制住。他望了一眼桌上的茶杯——茶色浑浊，显然下了药。
"柳如烟。"他默念这个名字，心底的疑问越来越深。父亲到底和明月楼有什么关系？为什么他们要杀一个素未谋面的人？
窗外突然飞入一张纸条，上面只有两个字：
"快走。"
李寻不再犹豫，纵身从二楼跃下，消失在夜色中。</textarea>
        </div>
      </div>

      <div id="raw-text-container" style="display:none;">
        <textarea id="raw-text" class="chapter-text" placeholder="在此粘贴整本小说文本。需包含至少 3 个章节标题（如「第一章」「Chapter 1」），服务端将自动识别并切分。" rows="18"></textarea>
      </div>

      <div class="button-row">
        <button class="btn-add" onclick="addChapter()">+ 添加章节</button>
        <span class="hint">至少需要 3 个章节</span>
      </div>

      <button class="btn-convert" id="btn-convert" onclick="convertNovel()">
        转换为剧本
      </button>
      <span class="convert-hint">约需 30-60 秒，DeepSeek LLM 处理中</span>
    </section>

    <!-- 进度区 -->
    <section class="progress-section" id="progress-section" style="display:none;">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-text" id="progress-text">正在连接...</p>
    </section>

    <!-- 输出区 -->
    <section class="output-section" id="output-section" style="display:none;">
      <div class="output-header">
        <h2>生成结果</h2>
        <div class="output-tabs">
          <button class="tab active" onclick="switchTab('yaml')">YAML</button>
          <button class="tab" onclick="switchTab('json')">JSON</button>
          <button class="tab" onclick="switchTab('tree')">章节结构</button>
          <button class="tab" onclick="switchTab('shots')">分镜列表</button>
          <button class="tab" onclick="switchTab('report')">
            检查报告
            <span class="score-badge" id="score-badge"></span>
          </button>
        </div>
      </div>

      <div class="output-content">
        <div class="tab-panel active" id="panel-yaml">
          <div class="output-actions">
            <button class="btn-action" onclick="copyOutput('yaml')">Copy</button>
            <button class="btn-action" onclick="downloadOutput('yaml')">Download .yaml</button>
          </div>
          <pre><code id="output-yaml"></code></pre>
        </div>
        <div class="tab-panel" id="panel-json">
          <div class="output-actions">
            <button class="btn-action" onclick="copyOutput('json')">Copy</button>
            <button class="btn-action" onclick="downloadOutput('json')">Download .json</button>
          </div>
          <pre><code id="output-json"></code></pre>
        </div>
        <div class="tab-panel" id="panel-tree">
          <div id="tree-content"></div>
        </div>
        <div class="tab-panel" id="panel-shots">
          <div id="shots-content"></div>
        </div>
        <div class="tab-panel" id="panel-report">
          <div id="report-content"></div>
        </div>
      </div>
    </section>

    <!-- 错误区 -->
    <section class="error-section" id="error-section" style="display:none;">
      <div class="error-card">
        <h3>转换失败</h3>
        <p id="error-message"></p>
        <button class="btn-retry" onclick="convertNovel()">Retry</button>
      </div>
    </section>
  </main>

  <footer>
    Powered by DeepSeek &middot; FastAPI &middot; Pydantic
  </footer>

  <script src="/static/script.js"></script>
</body>
</html>
